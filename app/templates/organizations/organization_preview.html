{% extends 'base/base.html' %}

{% block title %}組織プレビュー{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>組織プレビュー</h1>
    <a href="{% url 'app:organization_list' %}" class="btn btn-secondary">組織一覧に戻る</a>
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title">プレビュー日付を選択</h5>
      <form method="get" class="row g-3">
        <div class="col-auto">
          <label for="date" class="col-form-label">プレビュー日付:</label>
        </div>
        <div class="col-auto">
          <input
            type="date"
            class="form-control"
            id="date"
            name="date"
            value="{{ preview_date|date:'Y-m-d' }}">
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-primary">プレビュー</button>
        </div>
      </form>
      <p class="mt-3 text-muted mb-0">
        選択した日付までの予約更新を反映したツリーを表示します（実際のデータは変更されません）
      </p>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="card-title mb-0">組織ツリー（{{ preview_date|date:"Y年m月d日" }} 時点）</h5>
        <span class="badge bg-info">組織数: {{ organizations_count }}</span>
      </div>
      <div class="organization-tree">
        {{ tree_html|safe }}
      </div>
    </div>
  </div>
</div>

<style>
  .organization-tree {
    padding: 1rem;
  }

  .tree-root,
  .tree-children {
    list-style: none;
    padding-left: 1.5rem;
  }

  .tree-root {
    padding-left: 0;
  }

  .tree-node {
    display: inline-block;
    padding: 0.25rem 0.5rem;
    margin: 0.25rem 0;
    border-left: 3px solid #0d6efd;
    background-color: #f8f9fa;
    border-radius: 3px;
  }

  .tree-children {
    margin-top: 0.5rem;
  }
</style>
{% endblock %}
