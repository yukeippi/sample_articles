{% extends 'base/base.html' %}

{% block title %}新規記事作成{% endblock %}

{% block content %}
<div class="container mt-5">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{% url 'app:index' %}">記事一覧</a></li>
      <li class="breadcrumb-item active" aria-current="page">新規作成</li>
    </ol>
  </nav>

  <div class="row">
    <div class="col-md-8 offset-md-2">
      <h1 class="mb-4">新規記事作成</h1>

      <div class="card">
        <div class="card-body">
          <form method="post">
            {% csrf_token %}

            {% for field in form %}
              {% include "forms/_field.html" %}
            {% endfor %}

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">作成</button>
              <a href="{% url 'app:index' %}" class="btn btn-secondary">キャンセル</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
