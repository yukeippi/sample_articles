{% load static %}
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>{% block title %}{% endblock %}</title>

    <!-- Bootstrap CSS (ローカル) -->
    <link rel="stylesheet"
          href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'app:index' %}">Article App</a>
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'app:index' %}">記事一覧</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'app:employee_list' %}">社員一覧</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'app:organization_list' %}">組織一覧</a>
            </li>
          </ul>
          <div class="d-flex">
            {% if user.is_authenticated %}
              <span class="navbar-text me-3">
                ようこそ、<strong>{{ user.username }}</strong>さん
              </span>
              <form method="post" action="{% url 'app:logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">ログアウト</button>
              </form>
            {% else %}
              <a href="{% url 'app:login' %}" class="btn btn-outline-light btn-sm">ログイン</a>
            {% endif %}
          </div>
        </div>
      </div>
    </nav>

    {% block content %}
    {% endblock %}

    <!-- JS（bundle: Popper 同梱） -->
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
