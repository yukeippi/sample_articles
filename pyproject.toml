[project]
name = "workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2.8",
    "django-environ>=0.12.0",
    "django-extensions>=4.1",
    "ipython>=9.7.0",
    "psycopg2-binary>=2.9.11",
    "uuid6>=2025.0.1",
]

[dependency-groups]
dev = [
    "faker>=37.12.0",
    "model-bakery>=1.20.5",
    "pytest>=9.0.0",
    "pytest-django>=4.11.1",
    "ruff>=0.14.4",
]

[tool.ruff]
# Python version
target-version = "py314"

# Line length
line-length = 100

# Default paths to check
src = ["app", "config"]

[tool.ruff.lint]
# Enable rules
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "DJ",    # flake8-django
    "DTZ",   # flake8-datetimez
    "RUF",   # Ruff-specific rules
    "SIM",   # flake8-simplify
    "PTH",   # flake8-use-pathlib
]

# Ignore rules
ignore = [
    "E501",    # Line too long (handled by formatter)
    "DJ001",   # Avoid using null=True on string-based fields
    "RUF001",  # Ambiguous unicode character in string (日本語対応)
    "RUF002",  # Ambiguous unicode character in docstring (日本語対応)
    "RUF003",  # Ambiguous unicode character in comment (日本語対応)
    "RUF012",  # Mutable class default (Django migrations)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations",
    "*.egg-info",
    ".pytest_cache",
]

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules in test files
"**/tests/**/*.py" = [
    "S101",  # Use of assert detected
]
"**/conftest.py" = [
    "S101",  # Use of assert detected
]
# Ignore specific rules in config files
"config/**/*.py" = [
    "F403",    # Star imports for settings
    "F405",    # Undefined from star imports
    "PTH118",  # Allow os.path.join in config
    "PTH110",  # Allow os.path.exists in config
    "RUF003",  # Allow fullwidth parentheses in comments
]

[tool.ruff.lint.isort]
# isort settings
known-first-party = ["app", "config"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
# Format settings
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
